name: Build plugin

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0.1" >> "$GITHUB_ENV"
          fi

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: >
          dotnet publish Jellyfin.Plugin.AdvancedMetadata/Jellyfin.Plugin.AdvancedMetadata.csproj
          -c Release -o out
          -p:Version=${{ env.VERSION }}
          -p:AssemblyVersion=${{ env.VERSION }}
          -p:FileVersion=${{ env.VERSION }}

      - name: Package
        run: cd out && zip -r ../advanced-metadata.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: advanced-metadata
          path: advanced-metadata.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: advanced-metadata.zip

      - name: Update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MD5=$(md5sum advanced-metadata.zip | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          git config user.name github-actions
          git config user.email actions@github.com
          git fetch origin main
          git checkout main
          cat > manifest.json <<EOF
          [
            {
              "guid": "3f8b2c41-9a7d-4e5b-8c1a-6d2e4f7a9b03",
              "name": "Advanced Metadata",
              "description": "Builds a searchable index of custom audio metadata for Advanced Search.",
              "overview": "Reads audio tags into a local index. Jellyfin is never modified.",
              "owner": "audioadge",
              "category": "Metadata",
              "imageUrl": "https://raw.githubusercontent.com/audioadge/advanced-metadata/main/Jellyfin.Plugin.AdvancedMetadata/thumb.png?v=7",
              "versions": [
                {
                  "version": "${VERSION}",
                  "changelog": "Release ${VERSION}",
                  "targetAbi": "12.0.0.0",
                  "sourceUrl": "https://github.com/audioadge/advanced-metadata/releases/download/${GITHUB_REF_NAME}/advanced-metadata.zip",
                  "checksum": "${MD5}",
                  "imageUrl": "https://raw.githubusercontent.com/audioadge/advanced-metadata/main/Jellyfin.Plugin.AdvancedMetadata/thumb.png?v=7",
                  "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                }
              ]
            }
          ]
          EOF
          git add manifest.json
          git commit -m "Update manifest to ${VERSION}" || true
          git push origin main
