name: Build plugin

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: >
          dotnet publish Jellyfin.Plugin.AdvancedMetadata/Jellyfin.Plugin.AdvancedMetadata.csproj
          -c Release -o out

      - name: Package
        run: cd out && zip -r ../advanced-metadata.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: advanced-metadata
          path: advanced-metadata.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: advanced-metadata.zip
